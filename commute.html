<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>出門快查 · 西行</title>
<style>
:root{
  --primary:#1a73e8; --primary-dark:#1557b0; --primary-light:#e8f0fe;
  --secondary:#3b82f6; --secondary-dark:#2563eb; --secondary-light:#dbeafe;
  --accent:#f59e0b; --accent-light:#fef3c7;
  --bg:#f4f7fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1420; --card:#161e2d; --text:#e5e7eb; --muted:#9ca3af; --line:#2a3547;
    --primary-light:#1c2a44; --secondary-light:#1e2d4f; --accent-light:#3a2f14; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh}
.lk-bar{background:linear-gradient(135deg,#1a73e8 0%,#1557b0 100%);color:#fff;padding:10px 16px;
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lk-logo{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:300;font-style:italic;color:#1a73e8;
  transform:rotate(-6deg);font-family:'Brush Script MT','Segoe Script',cursive,sans-serif;flex:0 0 auto}
.lk-name{font-size:16px;font-weight:700;letter-spacing:.3px}
.lk-sub{font-size:11px;opacity:.85;margin-top:1px}
.lk-prod{margin-left:auto;font-size:12.5px;opacity:.9;text-align:right}
@media (max-width:640px){.lk-prod{margin-left:0;text-align:left;width:100%}}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:19px;margin:14px 2px 4px}
.note{font-size:12.5px;color:var(--muted);margin:0 2px 12px}
.statusbar{display:flex;align-items:center;gap:8px;margin:0 2px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#0f9d58;display:inline-block;flex:0 0 auto}
.dot.err{background:#dc2626}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;
  padding:5px 12px;font-size:12.5px;cursor:pointer;margin-left:auto}
.btn:active{opacity:.7}
.banner{display:none;background:#dc2626;color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;margin:0 2px 12px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:6px 12px;margin-bottom:16px}
.sec-head{display:flex;align-items:baseline;gap:8px;padding:10px 2px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-head .ico{font-size:17px}
.sec-head .t{font-size:15.5px;font-weight:700}
.sec-head .s{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.next{background:linear-gradient(90deg,var(--primary-light),transparent);border-radius:10px;padding-left:8px;padding-right:8px}
.badge{flex:0 0 auto;min-width:44px;text-align:center;background:var(--primary);color:#fff;font-weight:700;
  border-radius:8px;padding:6px 8px;font-size:15px}
.badge.tram{background:var(--secondary-dark)}
.mid{flex:1;min-width:0}
.dest{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub2{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.chip{display:inline-block;font-size:10.5px;border-radius:5px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.chip.kmb{background:var(--accent-light);color:#92400e}
.chip.ctb{background:var(--secondary-light);color:var(--primary-dark)}
.chip.live{background:#dcfce7;color:#166534}
.chip.sched{background:var(--secondary-light);color:var(--primary-dark)}
.chip.nx{background:var(--primary);color:#fff}
.eta{flex:0 0 auto;text-align:right}
.eta .m{font-size:21px;font-weight:800;color:var(--primary-dark);line-height:1.1}
.eta .m.dim{color:var(--muted)}
.eta .m.soon{color:var(--accent)}
.eta .t{font-size:11.5px;color:var(--muted)}
.empty{padding:16px 4px;font-size:13.5px;color:var(--muted)}
footer{margin-top:8px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (max-width:380px){
  .eta .m{font-size:18px}
  .badge{min-width:38px;padding:5px 6px;font-size:14px}
}
.soon{animation:pulse 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div class="lk-bar">
  <div class="lk-logo">k</div>
  <div>
    <div class="lk-name">leungkathy</div>
    <div class="lk-sub">All-in-One Dashboard Suite</div>
  </div>
  <div class="lk-prod">出門快查 · Commute Widget</div>
</div>

<div class="wrap">
  <h1>出門快查 · 西行（早上）</h1>
  <p class="note">巴士：聯發街站（皇后大道東 西行）10 / 109 / 113　·　電車：機利臣街站（西行）</p>

  <div class="statusbar">
    <span class="dot" id="dot"></span>
    <span id="status">載入中…</span>
    <button class="btn" id="refreshBtn">立即更新</button>
  </div>
  <div class="banner" id="banner"></div>

  <div class="card">
    <div class="sec-head"><span class="ico">🚌</span><span class="t">巴士</span><span class="s">邊架都好，睇最近一班</span></div>
    <div id="busList"><div class="empty">載入中…</div></div>
  </div>

  <div class="card">
    <div class="sec-head"><span class="ico">🚋</span><span class="t">電車</span><span class="s">機利臣街 西行</span></div>
    <div id="tramList"><div class="empty">載入中…</div></div>
  </div>

  <footer>
    每 30 秒自動更新（切到背景時會暫停）<br>
    資料來源：資料一線通（城巴／九巴開放數據）· HK Tramways ETA
  </footer>
</div>

<script>
"use strict";

/* ===== 設定（改站／線，改呢幾行） ===== */
const CTB_STOP   = "002488";               // 聯發街（皇后大道東 西行）城巴支柱
const KMB_STOP   = "EAAB84662A03A8F4";     // 同一支柱（九巴系統站碼）
const BUS_ROUTES = ["10","109","113"];
const TRAM_PROXY = "https://tram-eta-proxy.leunghlk.workers.dev";
const TRAM_PATH  = "/tram-eta/60W/westbound"; // 機利臣街 西行
const REFRESH_MS = 30000;

const TRAM_DEST_ZH = {
  "Kennedy Town":"堅尼地城","Western Market":"西港城","Shek Tong Tsui":"石塘咀",
  "Whitty Street":"屈地街","Happy Valley":"跑馬地","Happy Valley (Upper)":"跑馬地（上）",
  "Causeway Bay":"銅鑼灣","North Point":"北角","Sai Wan Ho":"西灣河","Shau Kei Wan":"筲箕灣",
  "Happy Valley Terminus":"跑馬地總站"
};

/* ===== 通用 ===== */
let lastOk = null;
let timer  = null;
const $    = id => document.getElementById(id);
const esc  = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = d => d.toLocaleTimeString("zh-HK",{hour:"2-digit",minute:"2-digit",hour12:false});

async function fetchJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
/* eta ISO 字串 → {min, ts}；無效回 null */
function parseEta(iso){
  if(!iso) return null;
  const t = Date.parse(iso);
  if(isNaN(t)) return null;
  return {min:Math.floor((t - Date.now())/60000), ts:new Date(t)};
}

/* ===== 巴士：城巴三線＋九巴聯營合併 ===== */
async function loadBuses(){
  const jobs = BUS_ROUTES.map(rt =>
    fetchJSON(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/${CTB_STOP}/${rt}`)
      .then(d => ({route:rt, src:"城巴", rows:d.data||[], ok:true}))
      .catch(() => ({route:rt, src:"城巴", rows:null, ok:false}))
  );
  jobs.push(
    fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${KMB_STOP}`)
      .then(d => ({route:null, src:"九巴", rows:d.data||[], ok:true}))
      .catch(() => ({route:null, src:"九巴", rows:null, ok:false}))
  );
  const results = await Promise.all(jobs);

  const byRoute = {}; BUS_ROUTES.forEach(rt => byRoute[rt] = []);
  for(const res of results){
    if(!res.ok) continue;                        // 呢個來源請求失敗
    for(const r of res.rows){
      const route = String(res.route || r.route || "");
      if(!BUS_ROUTES.includes(route)) continue;
      const e = parseEta(r.eta);
      if(!e) continue;                           // 冇 eta（九巴時段／暫停服務）→ 跳過
      e.co    = res.src;
      e.dest  = (r.dest_tc || "").trim();
      e.rmk   = (r.rmk_tc || "").trim();
      byRoute[route].push(e);
    }
  }

  const rowsOut = [];
  for(const rt of BUS_ROUTES){
    const list = byRoute[rt].sort((a,b)=>a.min-b.min);
    rowsOut.push({min:list.length ? list[0].min : null, rt, list});
  }
  // 最近一班排最頂＋高亮
  rowsOut.sort((a,b)=>(a.min??9999)-(b.min??9999));
  const idx = rowsOut.findIndex(r=>r.min!=null);
  $("busList").innerHTML = rowsOut.map((r,i)=>{
    if(!r.list.length) return `<div class="row">
      <span class="badge">${esc(r.rt)}</span>
      <span class="mid"><span class="dest">暫無實時班次</span>
      <span class="sub2">可能為九巴營運時段，或已收車</span></span>
      <span class="eta"><span class="m dim">—</span></span>
    </div>`;
    const [n0, n1] = r.list;
    return busRow(r.rt, n0, n1, i === idx);
  }).join("");
}

function busRow(rt, n0, n1, isNext){
  const soon = n0.min < 1;
  const coCls = n0.co === "九巴" ? "kmb" : "ctb";
  const rmk = n0.rmk && n0.rmk !== "原定班次" ? " · "+esc(n0.rmk) : "";
  const sub1 = n1 ? `下一班 ${n1.min<1 ? "即將到站" : n1.min+" 分鐘"}（${hhmm(n1.ts)}）` : "暫時只有一班資料";
  return `<div class="row${isNext?" next":""}">
    <span class="badge">${esc(rt)}</span>
    <span class="mid">
      <span class="dest">往 ${esc(n0.dest)} <span class="chip ${coCls}">${esc(n0.co)}</span>${isNext?'<span class="chip nx">下一班</span>':""}</span>
      <span class="sub2">${rmk ? rmk+"<br>" : ""}${esc(sub1)}</span>
    </span>
    <span class="eta">
      <span class="m${soon?" soon":""}">${soon ? "即將到站" : n0.min+" 分鐘"}</span><br>
      <span class="t">${hhmm(n0.ts)} 到站</span>
    </span>
  </div>`;
}

/* ===== 電車 ===== */
async function loadTram(){
  let d;
  try{
    d = await fetchJSON(TRAM_PROXY + TRAM_PATH);
  }catch(e){
    $("tramList").innerHTML = `<div class="empty">電車資料載入失敗，稍後自動重試</div>`;
    return;
  }
  const etas = (d && d.data && d.data.etas) || [];
  if(!etas.length){
    $("tramList").innerHTML = `<div class="empty">暫無班次資料（可能頭班車未開／尾班車已過）</div>`;
    return;
  }
  const rows = etas.map(e=>{
    let min = null;
    if(typeof e.arriving_in === "string" && e.arriving_in.toUpperCase() === "ARRIVED") min = 0;
    else if(e.arriving_in != null){ const v = parseInt(e.arriving_in,10); if(!isNaN(v)) min = v; }
    const zh   = TRAM_DEST_ZH[e.destination] || e.destination || "";
    const tram = e.tram_no ? "#"+esc(e.tram_no) : "";
    const live = e.eta_type === "ACTUAL";
    const ts   = e.estimated_arrival_time ? new Date(String(e.estimated_arrival_time).replace(" ","T")) : null;
    return {min, html:`<div class="row">
      <span class="badge tram">🚋</span>
      <span class="mid">
        <span class="dest">往 ${esc(zh)} ${tram}</span>
        <span class="sub2"><span class="chip ${live?"live":"sched"}">${live?"實時":"班表"}</span>${ts ? hhmm(ts)+" 到站" : ""}</span>
      </span>
      <span class="eta"><span class="m${min!=null&&min<1?" soon":""}">${min==null ? "—" : (min<1 ? "到站" : min+" 分鐘")}</span></span>
    </div>`};
  }).sort((a,b)=>(a.min??9999)-(b.min??9999));
  $("tramList").innerHTML = rows.slice(0,4).map(r=>r.html).join("");
}

/* ===== 主流程 ===== */
async function refresh(){
  $("refreshBtn").disabled = true;
  await loadBuses().catch(()=>{});
  await loadTram().catch(()=>{});

  const txt = $("busList").textContent + " " + $("tramList").textContent;
  const ok  = !/載入失敗/.test(txt);
  if(ok) lastOk = new Date();
  const stale = lastOk ? Math.floor((Date.now()-lastOk)/60000) : null;
  const dot = $("dot"), banner = $("banner");
  if(ok){
    dot.className = "dot";
    banner.style.display = "none";
    $("status").textContent = `更新於 ${hhmm(lastOk||new Date())} · 30 秒後自動刷新`;
  }else{
    dot.className = "dot err";
    banner.style.display = "block";
    banner.textContent = "部分資料來源暫時無法更新——以下為最後一次成功取得的資料，出門前請留意時效。";
    $("status").textContent = "更新失敗，繼續重試中";
  }
  $("refreshBtn").disabled = false;
}

function schedule(){
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{ if(!document.hidden) refresh(); }, REFRESH_MS);
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(); });
$("refreshBtn").addEventListener("click", refresh);
refresh().then(schedule);
</script>
</body>
</html>
